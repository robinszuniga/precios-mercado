name: Revisar logos (temporal)
on: workflow_dispatch
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - name: Íconos de las tiendas
        run: |
          pip install -q pillow
          for u in apple-touch-icon.png apple-touch-icon-precomposed.png favicon-32x32.png favicon-192x192.png arquivos/favicon.ico arquivos/exito-favicon.png; do
            echo "EXITO $u $(curl -sSL -m 15 -A 'Mozilla/5.0' -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "https://www.exito.com/$u")"
          done
          curl -sSL -m 20 -A "Mozilla/5.0" "https://www.exito.com/" | grep -oiE '(apple-touch-icon|og:image|manifest)[^>]{0,200}' | head -5 || true
          curl -sSL -m 20 -A "Mozilla/5.0" -o exito.ico "https://www.exito.com/favicon.ico"
          curl -sSL -m 20 -A "Mozilla/5.0" -o olimpica.png "https://www.olimpica.com/arquivos/olimpica-favicon1.png"
          curl -sSL -m 20 -A "Mozilla/5.0" -o d1.ico "https://d1tiendas.vteximg.com.br/arquivos/d1tiendas-favicon.ico"
          curl -sSL -m 20 -A "Mozilla/5.0" -o ara.png "https://sitemedia.aratiendas.com/wp-content/uploads/2021/03/cropped-icon-192x192.png"
          python3 - <<'PY'
          from PIL import Image
          import base64, io
          tira = Image.new('RGB', (4*56, 56), 'white')
          for i, f in enumerate(['exito.ico', 'olimpica.png', 'd1.ico', 'ara.png']):
              im = Image.open(f).convert('RGBA')
              print(f, im.size)
              fondo = Image.new('RGBA', im.size, 'white'); fondo.alpha_composite(im)
              tira.paste(fondo.convert('RGB').resize((48, 48), Image.LANCZOS), (i*56+4, 4))
          b = io.BytesIO(); tira.save(b, 'PNG', optimize=True)
          print('TIRA', base64.b64encode(b.getvalue()).decode())
          PY
