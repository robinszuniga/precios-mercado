name: Desplegar Edge Function VTEX

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-vtex
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar credencial de Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Falta el secreto SUPABASE_ACCESS_TOKEN en GitHub Actions"; exit 1; }

      - name: Desplegar vtex
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy vtex --project-ref ptsqflcptsgocqianklh
